[workspace]
members = ["boot"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Everest OS contributors"]

[workspace.dependencies]
uefi = { version = "0.34", features = ["panic_handler", "logger"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"
strip = true
