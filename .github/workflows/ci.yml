name: Everest OS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust formatting, UEFI compile and QEMU boot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-unknown-uefi
          components: rustfmt, clippy

      - name: Validate Rust sources with rustfmt
        run: cargo fmt --all

      - name: Check UEFI target
        run: cargo check --locked --target x86_64-unknown-uefi -p everest-boot

      - name: Run kernel unit tests (memory and FAT32 parser)
        run: cargo test --locked -p everest-kernel

      - name: Install QEMU/OVMF test tools
        timeout-minutes: 20
        run: |
          packages="qemu-system-x86 qemu-system-gui xvfb xauth ovmf dosfstools mtools socat"
          if ! sudo apt-get install -y --no-install-recommends $packages; then
            sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10
            sudo apt-get install -y $packages
          fi

      - name: Build and boot in QEMU/OVMF
        run: sh scripts/test-qemu.sh

      - name: Upload boot and QEMU diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everest-os-uefi-boot-and-diagnostics
          path: |
            dist/EFI/BOOT/BOOTX64.EFI
            dist/qemu-debug-*
            Cargo.lock
          if-no-files-found: warn
          retention-days: 14
