name: Everest OS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust formatting, UEFI compile and QEMU boot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-unknown-uefi
          components: rustfmt, clippy

      - name: Validate Rust sources with rustfmt
        run: cargo fmt --all

      - name: Check UEFI target
        run: cargo check --target x86_64-unknown-uefi -p everest-boot

      - name: Install QEMU/OVMF test tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf dosfstools mtools socat

      - name: Build and boot in QEMU/OVMF
        run: sh scripts/test-qemu.sh

      - name: Upload bootable EFI application
        uses: actions/upload-artifact@v4
        with:
          name: everest-os-uefi-boot
          path: |
            dist/EFI/BOOT/BOOTX64.EFI
            Cargo.lock
          if-no-files-found: error
          retention-days: 14
