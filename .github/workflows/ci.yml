name: Everest OS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust formatting, UEFI compile and QEMU boot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-unknown-uefi
          components: rustfmt, clippy

      - name: Validate Rust sources with rustfmt
        run: cargo fmt --all

      - name: Check UEFI target
        run: cargo check --locked --target x86_64-unknown-uefi -p everest-boot

      - name: Run kernel unit tests (memory and FAT32 parser)
        run: cargo test --locked -p everest-kernel

      - name: Install QEMU/OVMF test tools
        timeout-minutes: 30
        run: |
          set -euxo pipefail
          packages="qemu-system-x86 ovmf dosfstools mtools socat xorriso"
          # Refresh package indexes with bounded network retries before installing.
          sudo apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=60 \
            -o Acquire::https::Timeout=60 \
            -o Acquire::http::Pipeline-Depth=0
          # Keep installation from hanging indefinitely on a stalled mirror.
          timeout --foreground 25m sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=60 \
            -o Acquire::https::Timeout=60 \
            $packages
          qemu-system-x86_64 --version

      - name: Build UEFI application
        run: sh scripts/build-uefi.sh

      - name: Build bootable UEFI ISO
        run: sh scripts/build-iso.sh

      - name: Package standalone EFI ZIP
        run: |
          mkdir -p dist/efi-zip/EFI/BOOT
          cp dist/EFI/BOOT/BOOTX64.EFI dist/efi-zip/EFI/BOOT/BOOTX64.EFI
          (cd dist/efi-zip && zip -qr ../everest-os-uefi.zip .)

      - name: Build and boot in QEMU/OVMF
        run: sh scripts/test-qemu.sh

      - name: Upload bootable ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everest-os-iso
          path: dist/everest-os.iso
          if-no-files-found: warn
          retention-days: 14

      - name: Upload standalone EFI ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everest-os-uefi-zip
          path: dist/everest-os-uefi.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Upload boot and QEMU diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everest-os-uefi-boot-and-diagnostics
          path: |
            dist/EFI/BOOT/BOOTX64.EFI
            dist/everest-os.iso
            dist/qemu-debug-*
            Cargo.lock
          if-no-files-found: warn
          retention-days: 14
