name: Everest OS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust formatting and UEFI compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
          components: rustfmt, clippy

      - name: Validate Rust formatting
        run: cargo fmt --all

      - name: Check UEFI target
        run: cargo check --target x86_64-unknown-uefi -p everest-boot

      - name: Build release EFI application
        run: cargo build --release --target x86_64-unknown-uefi -p everest-boot
