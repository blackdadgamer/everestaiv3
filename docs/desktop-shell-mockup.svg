<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="768" viewBox="0 0 1360 768" role="img" aria-labelledby="title desc">
<title id="title">Everest OS Version 1.0 desktop shell visual target</title>
<desc id="desc">A deep navy desktop with a centered Everest Terminal window and a bottom taskbar containing Start, a kernel health indicator, and a 12:00 clock.</desc>
<defs>
  <linearGradient id="titlebar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#243958"/><stop offset="1" stop-color="#192b46"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dy="8"/><feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1360" height="768" fill="#0c1120"/>
<g filter="url(#shadow)">
 <rect x="345" y="150" width="670" height="455" rx="8" fill="#0e1424" stroke="#719cff" stroke-width="2"/>
 <path d="M353 150h654a8 8 0 0 1 8 8v54H345v-54a8 8 0 0 1 8-8z" fill="url(#titlebar)"/>
 <rect x="367" y="171" width="24" height="20" rx="3" fill="#78a8ff"/>
 <path d="M373 177h12M373 182h8M373 187h10" stroke="#0c1120" stroke-width="2" stroke-linecap="round"/>
 <text x="405" y="187" font-family="ui-monospace,monospace" font-size="20" font-weight="600" fill="#f1f5ff">Everest Terminal</text>
 <circle cx="967" cy="181" r="5" fill="#a8b8d3"/><circle cx="986" cy="181" r="5" fill="#a8b8d3"/><path d="M999 176l10 10m0-10l-10 10" stroke="#d4deef" stroke-width="2"/>
 <text x="379" y="259" font-family="ui-monospace,monospace" font-size="20" fill="#8fa8d2">Everest OS ready</text>
 <text x="379" y="307" font-family="ui-monospace,monospace" font-size="20" fill="#f1f5ff">Welcome, admin</text>
 <rect x="379" y="331" width="10" height="21" fill="#78a8ff"/>
</g>
<rect x="0" y="696" width="1360" height="72" fill="#141c30"/>
<path d="M0 696H1360" stroke="#344767" stroke-width="2"/>
<rect x="20" y="714" width="130" height="38" rx="5" fill="#2a3e60" stroke="#789cff" stroke-width="2"/>
