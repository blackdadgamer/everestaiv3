<text x="59" y="739" font-family="ui-monospace,monospace" font-size="16" font-weight="700" fill="#f5f7ff">START</text>
<circle cx="1160" cy="732" r="5" fill="#6ebaff"/>
<text x="1175" y="738" font-family="ui-monospace,monospace" font-size="15" fill="#a9bddf">Kernel health</text>
<path d="M1290 712v40" stroke="#344767" stroke-width="1.5"/>
<text x="1318" y="738" text-anchor="end" font-family="ui-monospace,monospace" font-size="19" font-weight="600" fill="#f1f5ff">12:00</text>
</svg>